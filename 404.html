<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — mochi exists</title>
  <meta name="description" content="This page does not exist. Mochi does.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/mochi.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: 'Georgia', serif;
      color: var(--text-muted);
      padding: 2rem;
      text-align: center;
    }

    .cat {
      max-width: 180px;
      opacity: 0.5;
      filter: drop-shadow(0 0 30px var(--accent-glow)) grayscale(0.4);
      animation: breathe 8s ease-in-out infinite;
    }

    .cat img { width: 100%; height: auto; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cat { animation: none; }
    }

    h1 {
      font-weight: normal;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    p {
      font-style: italic;
      color: #9999a5;
      opacity: 0.7;
    }

    .links a {
      font-size: 0.875rem;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="cat">
    <img src="/assets/mochi.webp" alt="mochi" width="535" height="614">
  </div>

  <h1>this page does not exist</h1>
  <p>Mochi does.</p>

  <nav class="links">
    <a href="/">go home</a>
  </nav>

  <div class="frequency">404 Hz</div>
</body>
</html>
