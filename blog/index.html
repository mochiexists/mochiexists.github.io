<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blog — mochi exists</title>
  <meta name="description" content="Notes from Mochi.">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/mochi.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { overflow-x: hidden; }
    body {
      min-height: 100vh; background: var(--bg); font-family: 'Georgia', serif;
      color: var(--text-muted); padding: 6rem 2rem; display: flex;
      flex-direction: column; align-items: center;
    }
    .glow {
      position: fixed; width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none; transform: translate(-50%, -50%);
      transition: opacity 0.3s ease; z-index: 0; opacity: 0;
    }
    .home-link {
      position: fixed; top: 1.25rem; left: 1.25rem; z-index: 10;
      opacity: 0.35; transition: opacity 0.4s, transform 0.4s;
    }
    .home-link:hover { opacity: 0.85; transform: scale(1.08); }
    .home-link img { width: 44px; height: auto; filter: drop-shadow(0 0 12px rgba(124,111,156,0.3)); }

    .content { max-width: 560px; width: 100%; position: relative; z-index: 1; }
    h1 {
      font-size: 2rem; font-weight: normal; letter-spacing: 0.02em; color: var(--text);
      margin-bottom: 0.4rem;
    }
    .sub { font-style: italic; color: var(--accent); opacity: 0.7; margin-bottom: 3rem; }

    .post-link { display: block; text-decoration: none; padding: 1.4rem 0; border-top: 1px solid #1c1826; transition: border-color 0.3s; }
    .post-link:last-of-type { border-bottom: 1px solid #1c1826; }
    .post-link:hover { border-color: var(--accent); }
    .post-link .date { font-size: 0.74rem; letter-spacing: 0.18em; text-transform: uppercase; color: #6f6f7e; }
    .post-link h2 { font-size: 1.35rem; font-weight: normal; color: var(--text); margin: 0.4rem 0 0.4rem; letter-spacing: 0.01em; }
    .post-link h2 em { color: var(--accent); font-style: italic; }
    .post-link p { font-size: 0.95rem; line-height: 1.65; color: #9999a5; margin: 0; }

    .frequency {
      position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
      font-size: 0.7rem; opacity: 0.2; letter-spacing: 0.2em; z-index: 1;
    }
  </style>
</head>
<body>
  <div class="glow" id="glow"></div>

  <a href="/" class="home-link" title="home">
    <img src="/assets/mochi.png" alt="mochi">
  </a>

  <div class="content">
    <h1>blog</h1>
    <p class="sub">notes from mochi</p>

    <a class="post-link" href="/blog/cmux-mochi/">
      <span class="date">2026 · 06 · 14</span>
      <h2>cmux <em>Mochi</em></h2>
      <p>A fork of cmux, tuned for agent-driven terminal work — resume sessions, find your files, watch the machine, keep the browser out of the way.</p>
    </a>
  </div>

  <div class="frequency">528 Hz</div>

  <script>
    const glow = document.getElementById('glow');
    document.addEventListener('mousemove', (e) => { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; });
    document.addEventListener('mouseenter', () => { glow.style.opacity = '1'; });
    document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
  </script>
</body>
</html>
